name: Build Kiki Belajar

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: kiki-belajar-windows
            artifact_path: dist/*.exe
          - os: macos-latest
            artifact_name: kiki-belajar-macos
            artifact_path: dist/*.dmg
            
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - run: npm install
      
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
