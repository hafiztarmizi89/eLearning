<!DOCTYPE html>
<html lang="ms"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kiki Belajar</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#3b3a4a;--mut:#7a7890;--a:#a9c8e8;--b:#f2b5a7;--c:#b4dcc3;--d:#f6e3a8;--ok:#6fbf87;--line:#ddd8cc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#26262f;--card:#33333f;--ink:#f0eee8;--mut:#b5b3c4;--line:#474757}}
:root[data-theme="dark"]{--bg:#26262f;--card:#33333f;--ink:#f0eee8;--mut:#b5b3c4;--line:#474757}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Trebuchet MS','Comic Sans MS',system-ui,sans-serif;text-align:center}
#app{max-width:720px;margin:auto;padding:14px}
.btn{font:inherit;font-size:22px;padding:14px 22px;border:0;border-radius:22px;background:var(--a);color:#2b2f45;margin:6px;cursor:pointer}
.btn.alt{background:var(--d)}.btn.sm{font-size:16px;padding:8px 14px}.btn.done{background:var(--c)}.btn:disabled{opacity:.5}
.opt{font-size:40px;min-width:96px}.no{background:var(--b);animation:sh .3s}.hint{outline:5px solid var(--ok)}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.card{background:var(--card);border-radius:22px;padding:16px;margin:12px 0}
input{width:100%;box-sizing:border-box;padding:12px;font:inherit;font-size:18px;margin:6px 0;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.er{color:#c0504d;min-height:1.3em}.pg{color:var(--mut)}.prompt{font-size:28px;margin:12px 0}
.word{font-size:64px;font-weight:700;letter-spacing:4px}.big{font-size:90px}.em{font-size:36px;line-height:1.3;word-break:break-all}
.sw{display:inline-block;width:64px;height:64px;vertical-align:middle}
.row,.grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.kiki{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0}.bub{background:var(--card);border-radius:18px;padding:10px 16px;font-size:20px}
.chip{font-size:48px;touch-action:none;cursor:grab;background:var(--card);border-radius:16px;padding:8px;position:relative;user-select:none}
.slot{min-width:120px;min-height:76px;border:3px dashed var(--mut);border-radius:16px;padding:8px;font-size:22px;display:flex;align-items:center;justify-content:center;gap:6px}
.slot.ok{border-style:solid;border-color:var(--ok)}
#cv{width:100%;max-width:300px;touch-action:none;background:var(--card);border-radius:20px}
.bl{min-width:64px;min-height:80px;font-size:44px;font-weight:700;border:3px dashed var(--mut);border-radius:14px;display:inline-flex;align-items:center;justify-content:center;margin:0 3px;vertical-align:middle;cursor:pointer}.bl.f{border-style:solid;border-color:var(--ok)}.bl.x{border-color:#c0504d}.lt{font-size:44px;font-weight:700;display:inline-block;margin:0 3px}#bar{margin-bottom:6px}
@keyframes bn{50%{transform:translateY(-10px)}}
@media print{#bar,button{display:none}}
</style></head><body>
<div id="app"></div>
<div id="bar" style="text-align:center" hidden><button id="bk" class="btn alt sm" onclick="endSess(0);lvl(LV)">⬅ Keluar</button> <b id="tm">⏱ 00:00</b> <button class="btn sm" onclick="renew()">🔄 Tukar Soalan</button><span id="nt" class="pg"></span></div>
<script>
const $=s=>document.querySelector(s),A=$('#app');
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,SH=a=>[...a].sort(()=>Math.random()-.5),P=a=>a[R(0,a.length-1)];
let DB={users:{}},U=null,LV=0,CUR={};
try{DB=JSON.parse(localStorage.getItem('kiki'))||DB}catch(e){}
const save=()=>{try{localStorage.setItem('kiki',JSON.stringify(DB))}catch(e){}};
const say=t=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ms-MY';u.rate=.8;u.pitch=1.3;speechSynthesis.speak(u)}catch(e){}};
const bk=v=>$('#bar').hidden=!v;
const OK=['Pandai, @!','Betul! Hebat, @!','Bagus, @!'];
let TI=null,T0=0,SN='',SC={c:0,n:0};
const fm=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function endSess(f){if(!TI)return;clearInterval(TI);TI=null;const d=Math.round((Date.now()-T0)/1000);U.l=(U.l||[]).concat({n:SN,d,f:f?1:0,sc:SC.n?SC.c+'/'+SC.n:''}).slice(-30);save()}
const KS='<svg viewBox="0 0 100 100" width="84" height="84"><ellipse cx="36" cy="26" rx="9" ry="22" fill="#f3efe9" stroke="#cfc8bd"/><ellipse cx="64" cy="26" rx="9" ry="22" fill="#f3efe9" stroke="#cfc8bd"/><ellipse cx="36" cy="28" rx="4" ry="14" fill="#f5b9c4"/><ellipse cx="64" cy="28" rx="4" ry="14" fill="#f5b9c4"/><circle cx="50" cy="64" r="30" fill="#f3efe9" stroke="#cfc8bd"/><circle cx="40" cy="60" r="4" fill="#3b3a4a"/><circle cx="60" cy="60" r="4" fill="#3b3a4a"/><ellipse cx="50" cy="70" rx="4" ry="3" fill="#f5b9c4"/><path d="M44 76q6 5 12 0" stroke="#3b3a4a" fill="none" stroke-width="2" stroke-linecap="round"/><circle cx="32" cy="70" r="5" fill="#f9d3d9" opacity=".7"/><circle cx="68" cy="70" r="5" fill="#f9d3d9" opacity=".7"/></svg>';
const kiki=m=>`<div class="kiki">${KS}<div class="bub">${m}</div></div>`;
const LI=['Tahap 0 · 1–2 tahun','Tahap 1 · 3–4 tahun','Tahap 2 · 4–5 tahun','Tahap 3 · 5–6 tahun'];
const TP=[{id:'huruf',n:'Huruf',e:'🔤'},{id:'baca',n:'Membaca',e:'📖'},{id:'tulis',n:'Menulis',e:'✏️'},{id:'eja',n:'Ejaan',e:'🧩'},{id:'kira',n:'Mengira',e:'🔢'},{id:'objek',n:'Objek, Warna & Bentuk',e:'🎨'}];
const NS=i=>i?4:3;
// data
const OB=[['🐱','kucing'],['🐘','gajah'],['🐰','arnab'],['🍎','epal'],['🍌','pisang'],['🚲','basikal'],['🚗','kereta'],['🐟','ikan'],['⚽','bola'],['📖','buku'],['🌸','bunga'],['☀️','matahari'],['🐔','ayam'],['🏠','rumah']];
const CL=[['#e57373','merah'],['#6fa8dc','biru'],['#81c784','hijau'],['#f6d365','kuning'],['#ffb74d','oren'],['#ba68c8','ungu']].map(([c,n])=>[`<span class="sw" style="background:${c};width:88px;height:44px;border-radius:12px"></span>`,n]);
const SP=[['border-radius:50%','bulat'],['','segi empat'],['clip-path:polygon(50% 0,100% 100%,0 100%)','segi tiga'],['clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)','bintang']].map(([s,n])=>[`<span class="sw" style="background:#7aa6d6;${s}"></span>`,n]);
const W=s=>s.split(',').map(x=>{const[a,e]=x.split(' ');return[a.split('-'),e]});
const WP=[[],W('bo-la ⚽,bu-ku 📖,i-kan 🐟,a-yam 🐔,e-pal 🍎,su-su 🥛,ma-ta 👁️,to-pi 🧢'),W('ku-cing 🐱,ga-jah 🐘,bu-nga 🌸,pi-sang 🍌,ar-nab 🐰,ru-mah 🏠,ka-sut 👟,ba-ju 👕'),[...W('ba-si-kal 🚲,ke-re-ta 🚗,ma-ta-ha-ri ☀️,pe-lan-gi 🌈,be-lon 🎈,ka-pal 🚢'),[['Ibu','masak','nasi'],'🍚',1],[['Adik','makan','epal'],'🍎',1],[['Kucing','minum','susu'],'🐱',1]]];
const LP=['AEIOU','ABCDEFGHIJKLM','NOPQRSTUVWXYZ'],ALL='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const TW=['A B C D E 1 2 3 4 5','F G H I J 6 7 8 9 10','a b d g m n s t 11 12 13 14 15'].map(s=>s.split(' '));
const EM=['🍎','🍌','⭐','🐟','⚽'];
const nums=a=>{const s=new Set([a]);[1,-1,2,10,-2,3].forEach(d=>{if(s.size<4&&a+d>=0)s.add(a+d)});return SH([...s])};
const GEN={
huruf:()=>SH(LP[LV-1].split('')).slice(0,4).map(L=>({t:'mcq',i:'Huruf '+L,s:'Huruf '+L,h:()=>'🔊 Dengar, pilih huruf yang betul',o:SH([L,...SH(ALL.filter(x=>x!=L)).slice(0,3)]).map(x=>x+x.toLowerCase()),a:[L+L.toLowerCase()]})),
baca:()=>SH(WP[LV]).slice(0,4).map(w=>{const j=w[0].join(w[2]?' ':'');return{t:'baca',c:w[0],e:w[1],sent:w[2],s:j,i:j}}),
tulis:()=>SH(TW[LV-1]).slice(0,4).map(x=>({t:'tulis',l:x,i:'Tulis '+x})),
eja:()=>SH(WP[LV].filter(w=>!w[2])).slice(0,4).map(w=>{const Wd=w[0].join('').toUpperCase(),nb=LV>1?2:1,pos=SH([...Wd].map((_,j)=>j)).slice(0,nb).sort((a,b)=>a-b),ans=pos.map(j=>Wd[j]),st=new Set(ans);SH(ALL).forEach(c=>{if(st.size<5)st.add(c)});
 return{t:'mcq',i:Wd,s:'Eja '+w[0].join(''),a:ans,o:SH([...st]),h:k=>`<div class="big">${w[1]}</div><div class="word">${[...Wd].map((c,j)=>{const b=pos.indexOf(j);return b<0||b<k?c:'_'}).join(' ')}</div>`}}),
kira:()=>[0,1,2,3].map(j=>{const e=P(EM);let h,a,s;
 if(LV==1){if(j%2){a=R(1,10);h=`<div class="em">${e.repeat(a)}</div>Berapa semuanya?`;s='Kira, berapa semuanya?'}else{const x=R(1,3),y=R(1,5-x);a=x+y;h=`<div class="em">${e.repeat(x)} + ${e.repeat(y)}</div>= ?`;s='Berapa semuanya?'}}
 else if(LV==2){if(j%2){a=R(11,20);h=`<div class="em">${e.repeat(a)}</div>Berapa semuanya?`;s='Kira, berapa semuanya?'}else{const x=R(5,15),y=R(1,20-x);if(j==2){a=x+y;h=`${x} + ${y} = ?`;s=`${x} tambah ${y} sama dengan berapa`}else{a=x;h=`${x+y} − ${y} = ?`;s=`${x+y} tolak ${y} sama dengan berapa`}}}
 else{const x=R(100,600),y=R(10,300);if(j%2){a=x+y;h=`${x} + ${y} = ?`;s=`${x} tambah ${y} sama dengan berapa`}else{a=x;h=`${x+y} − ${y} = ?`;s=`${x+y} tolak ${y} sama dengan berapa`}}
 return{t:'mcq',i:LV==3?'Tambah/tolak 3 digit':'Nombor '+a,s,h:()=>h,o:nums(a).map(String),a:[String(a)]}}),
objek:()=>[0,1,2,3].map(j=>{
 if(LV==0){const pool=j%2?P([CL,SP]):OB,t=P(pool),ds=SH(pool.filter(x=>x!=t)).slice(0,2);return{t:'mcq',i:t[1],s:'Mana '+t[1],h:()=>`Mana ${t[1]}? 🔊`,o:SH([t,...ds]).map(x=>x[0]),a:[t[0]]}}
 const pool=LV==1?OB:[...OB,...CL,...SP];return{t:'drag',d:SH(pool).slice(0,LV==3?4:3),s:'Seret gambar ke perkataan yang betul'}})};
GEN.eja=()=>SH(WP[LV].filter(w=>!w[2])).slice(0,4).map(w=>{const Wd=w[0].join('').toUpperCase(),nb=LV>2?(Wd.length>6?3:2):LV>1?2:1,pos=SH([...Wd].map((_,j)=>j)).slice(0,nb).sort((a,b)=>a-b),ans=pos.map(j=>Wd[j]),t=[...ans];SH(ALL).forEach(c=>{if(t.length<ans.length+3&&!t.includes(c))t.push(c)});return{t:'eja',i:Wd,s:'Eja '+w[0].join(''),e:w[1],w:Wd,pos,ans,tiles:SH(t)}});
// helpers
WP[1].push(...W('ti-kus 🐭,be-bek 🦆,le-bah 🐝,ke-ju 🧀,ro-ti 🍞,te-lur 🥚'));
WP[2].push(...W('bin-tang ⭐,lem-bu 🐄,ku-da 🐴,ba-wang 🧅,ke-tam 🦀'));
WP[3].push(...W('pe-sa-wat ✈️,ke-re-ta-pi 🚂,ma-ka-nan 🍽️,ke-ru-si 🪑,te-le-fon 📞'),[['Ayah','baca','buku'],'📖',1],[['Ali','main','bola'],'⚽',1],[['Ibu','beli','roti'],'🍞',1],[['Adik','minum','susu'],'🥛',1]);
TW[0].push(...'a b c d e'.split(' '));TW[1].push(...'f g h i j'.split(' '));TW[2].push(...'k p r 16 17 18 19 20'.split(' '));
GEN.huruf=()=>[0,1,2,3].map(()=>{const L=P(LP[LV-1].split('')),l=L.toLowerCase(),v=R(0,2),oth=SH(ALL.filter(x=>x!=L)).slice(0,3);
 if(v==0)return{t:'mcq',i:'Huruf '+L,s:'Huruf '+L,h:()=>'🔊 Dengar, pilih huruf yang betul',o:SH([L,...oth]).map(x=>x+x.toLowerCase()),a:[L+l]};
 if(v==1)return{t:'mcq',i:'Huruf '+L,s:'Mana huruf kecil bagi '+L,h:()=>`Mana huruf kecil bagi <b>${L}</b>? 🔊`,o:SH([l,...oth.map(x=>x.toLowerCase())]),a:[l]};
 return{t:'mcq',i:'Huruf '+L,s:'Mana huruf besar bagi '+l,h:()=>`Mana huruf besar bagi <b>${l}</b>? 🔊`,o:SH([L,...oth]),a:[L]}});
const K=q=>q.t=='drag'?q.d.map(x=>x[1]).sort().join('|'):q.s+'|'+(q.h?q.h(0):q.i||q.l);
function mk(t,n){const r=[],seen=new Set();for(let a=0;a<n*40&&r.length<n;a++)for(const q of GEN[t]()){const k=K(q);if(!seen.has(k)&&r.length<n){seen.add(k);r.push(q)}}
 while(r.length<n)r.push(...GEN[t]().slice(0,n-r.length));return SH(r)}
const NQ=i=>(U.q||{})[i]||5,sc=ok=>{SC.n++;if(ok)SC.c++};
const qsel=i=>`<div class="card">Jumlah soalan: ${[5,10,15,20,50,100].map(x=>`<button class="btn sm${NQ(i)==x?' done':''}" onclick="setq(${i},${x})">${x}</button>`).join('')}</div>`;
function setq(i,x){U.q=U.q||{};U.q[i]=x;save();lvl(i)}
function fin(){const g=SC.n>0,p=g?Math.round(SC.c/SC.n*100):0,w=g&&p>=80;if(w){U.r=(U.r||0)+1;save()}
 const m=w?`Hebat, ${U.nick}! Kamu dapat hadiah!`:`Tahniah, ${U.nick}! Terus berlatih ya.`;say(m);
 A.innerHTML=kiki(m)+(g?`<div class="card"><div class="big">${w?'🏆':'⭐'}</div><div class="word">${SC.c}/${SC.n}</div><p>Markah: <b>${p}%</b></p>${w?'<div class="em" style="animation:bn 1s infinite">🎉🌟🎈🌟🎉</div><p>Hadiah: 1 piala 🏆</p>':''}</div>`:'<p>Latihan membaca dan menulis tiada markah. Hebat!</p>')+`<button class="btn" onclick="lvl(${LV})">Seterusnya ➜</button>`}
function rr(){A.innerHTML=kiki('Padam semua data laporan?')+'<p>Kemajuan, masa belajar, sesi dan hadiah akan dipadam.</p><button class="btn alt" onclick="U.s={};U.l=[];U.t=0;U.p={};U.r=0;save();report()">Ya, reset</button><button class="btn" onclick="report()">Batal</button>'}
function rec(k,ok){const s=U.s[k]||(U.s[k]={g:0,b:0});ok?s.g++:s.b++;save()}
const hd=(i,n)=>`<div class="pg">${i}/${n}</div>`;
// screens
function login(){bk(0);A.innerHTML=kiki('Hai! Saya Kiki. Jom belajar!')+`<div class="card"><input id="u" placeholder="Nama pengguna" autocapitalize="off"><input id="p" type="password" placeholder="Kata laluan"><input id="n" placeholder="Nama panggilan (untuk daftar baharu)"><input id="rp" type="password" inputmode="numeric" maxlength="4" placeholder="PIN 4 digit ibu bapa atau guru (daftar baharu)"><div id="er" class="er"></div><button class="btn" onclick="enter(0)">Masuk</button><button class="btn alt" onclick="enter(1)">Daftar</button><div class="pg">Versi 2.0</div></div>`}
function enter(reg){const u=$('#u').value.trim().toLowerCase(),p=$('#p').value,n=$('#n').value.trim(),er=$('#er');
 if(!u||!p){er.textContent='Sila isi nama pengguna dan kata laluan.';return}
 if(reg){if(DB.users[u]){er.textContent='Nama pengguna sudah ada.';return}if(!n){er.textContent='Sila isi nama panggilan.';return}const pn=$('#rp').value;if(!/^\d{4}$/.test(pn)){er.textContent='Tetapkan PIN 4 digit untuk ibu bapa atau guru.';return}DB.users[u]=U={u,pw:p,nick:n,pin:pn,p:{},s:{},t:0};save()}
 else{const x=DB.users[u];if(!x||x.pw!==p){er.textContent='Nama pengguna atau kata laluan salah.';return}U=x}
 U.sc=U.sc||{};U.st=U.st||{};say('Hai '+U.nick);home()}
function pre(){bk(0);A.innerHTML=kiki(`Hai, ${U.nick}! Pilih tahap ya.${U.r?' 🏆 '+U.r:''}`)+`<div class="grid">${LI.map((l,i)=>`<button class="btn" onclick="lvl(${i})">${l}</button>`).join('')}</div><button class="btn alt" onclick="home()">⬅ Menu utama</button><button class="btn alt" onclick="report()">📋 Laporan Pra-Sekolah</button><button class="btn alt" onclick="U=null;login()">Keluar</button>`}
function lvl(i){LV=i;bk(0);speechSynthesis&&speechSynthesis.cancel();const tl=TP.filter(t=>i>0||t.id=='objek');
 A.innerHTML=`<button class="btn alt sm" onclick="pre()">⬅</button><h2>${LI[i]}</h2>`+qsel(i)+tl.map(t=>{const d=U.p[i+':'+t.id]||0;return`<div class="card"><b>${t.e} ${t.n}</b><div class="row">${[...Array(NS(i))].map((_,s)=>s<=d?`<button class="btn sm${s<d?' done':''}" onclick="run('${t.id}',${s})">${s<d?'⭐':s+1}</button>`:`<button class="btn sm" disabled>🔒</button>`).join('')}</div></div>`}).join('')}
function run(t,s){endSess(0);CT=t;CS=s;bk(1);SN=LI[LV]+' · '+TP.find(x=>x.id==t).n+' · Aktiviti '+(s+1);T0=Date.now();$('#tm').textContent='⏱ 00:00';TI=setInterval(()=>{$('#tm').textContent='⏱ '+fm(Math.round((Date.now()-T0)/1000))},1000);SC={c:0,n:0};const qs=mk(t,NQ(LV)),n=qs.length;let i=0;$('#nt').textContent=n<NQ(LV)?' · hanya '+n+' soalan unik':'';
 const nx=()=>{if(i>=n){const k=LV+':'+t;U.p[k]=Math.max(U.p[k]||0,s+1);endSess(1);bk(0);fin();return}
  const q=qs[i++];CUR=q;ENG[q.t](q,nx,i,n)};nx()}
function mcq(q,nx,i,n){let k=0,bad=0;const o=q.o;
 const draw=()=>{A.innerHTML=`${hd(i,n)}<div class="prompt">${q.h(k)}</div><button class="btn alt sm" onclick="say(CUR.s)">🔊</button><div class="row">${o.map((x,j)=>`<button class="btn opt" data-j="${j}">${x}</button>`).join('')}</div>`;
  A.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const j=+b.dataset.j;
   if(o[j]===q.a[k]){say(P(OK).replace('@',U.nick));if(++k>=q.a.length){rec(q.i,bad==0);sc(bad==0);setTimeout(nx,900)}else draw()}
   else{bad++;b.classList.add('no');say('Cuba lagi ya, '+U.nick);if(bad>=2)A.querySelectorAll('.opt')[o.indexOf(q.a[k])].classList.add('hint')}})};
 draw();say(q.s)}
function eja(q,nx,i,n){let bad=0;
 const draw=()=>{A.innerHTML=`${hd(i,n)}<div class="big">${q.e}</div><div class="prompt">Seret huruf ke petak kosong</div><div>${[...q.w].map((c,j)=>q.pos.includes(j)?`<span class="bl" data-j="${j}"></span>`:`<span class="lt">${c}</span>`).join('')}</div><br><div class="row">${q.tiles.map(c=>`<div class="chip" data-c="${c}">${c}</div>`).join('')}</div><div><button class="btn alt sm" onclick="say(CUR.s)">🔊</button><button class="btn" id="hn">Hantar</button></div><div id="rs" class="er"></div>`;
  A.querySelectorAll('.chip').forEach(c=>{c.onpointerdown=e=>{e.preventDefault();c.setPointerCapture(e.pointerId);const sx=e.clientX,sy=e.clientY;c.style.zIndex=9;
   c.onpointermove=m=>{c.style.transform=`translate(${m.clientX-sx}px,${m.clientY-sy}px)`};
   c.onpointerup=m=>{c.onpointermove=c.onpointerup=null;c.style.pointerEvents='none';const t=document.elementFromPoint(m.clientX,m.clientY);c.style.pointerEvents='';const b=t&&t.closest('.bl');

function pd(){const ds=[],nd=[];for(const k in U.sc){const[m,s,y,i]=k.split('|'),t=TPS(m,s,+y)[+i];if(!t)continue;(U.sc[k].best>=80?ds:nd).push(`${SUB[m].find(x=>x[0]==s)[1]} T${y}: ${t.n}`)}
 const rows=['srk','sra'].map(m=>SUB[m].filter(s=>!s[2]).map(s=>{const sc=Object.keys(U.sc).filter(k=>k.startsWith(m+'|'+s[0]+'|')).map(k=>U.sc[k].best||0);return`<tr><td>${s[1]}</td><td>${prog(m,s[0])}%</td><td>${Math.round((U.st[s[0]]||0)/60)} min</td><td>${sc.length?Math.max(...sc)+'%':'-'}</td></tr>`}).join('')).join('');
 A.innerHTML=`<button class="btn alt sm" onclick="home()">⬅</button><div class="card" style="text-align:left"><h2>Laporan ${U.nick}</h2><p>Piala: ${U.r||0} 🏆</p><table style="width:100%;font-size:15px;text-align:left"><tr><th>Subjek</th><th>Siap</th><th>Masa</th><th>Terbaik</th></tr>${rows}</table><p><b>Dikuasai:</b> ${ds.join('; ')||'-'}</p><p><b>Perlu diulang kaji:</b> ${nd.join('; ')||'-'}</p></div><button class="btn" onclick="window.print()">Cetak</button><button class="btn alt" onclick="report()">Laporan Pra-Sekolah</button><button class="btn alt" onclick="cv()">Urus soalan (CSV)</button><button class="btn alt" onclick="rs()">Reset data sekolah</button>`}
function csv(t){const r=[];let f='',row=[],q=0;t=t.replace(/^\uFEFF/,'');for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=0}else f+=c}else if(c=='"')q=1;else if(c==','){row.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;row.push(f);f='';if(row.some(x=>x.trim()))r.push(row);row=[]}else f+=c}row.push(f);if(row.some(x=>x.trim()))r.push(row);return r}
function cv(){bk(0);const n=(DB.cq||[]).length,nm=Object.values(SUB).flat().filter(s=>!s[2]).map(s=>s[1]).join(', ');
 A.innerHTML=`<button class="btn alt sm" onclick="pd()">⬅</button><div class="card" style="text-align:left"><h2>Urus soalan (CSV)</h2><p>Soalan import disimpan pada peranti ini dan tersedia untuk semua akaun di peranti ini. Jumlah soalan import: <b>${n}</b></p><input type="file" id="cf" accept=".csv,text/csv"><div id="cr"></div><p><b>Lajur (baris pertama ialah tajuk):</b></p><pre style="white-space:pre-wrap;font-size:13px">subjek,tahun,topik,subtopik,soalan,pilihan_a,pilihan_b,pilihan_c,pilihan_d,jawapan,penjelasan</pre><p class="pg">Subjek: ${nm}. Jawapan: A, B, C atau D. Pilihan C dan D boleh dikosongkan. Versi 2.0 memaparkan tahun 1.</p></div><button class="btn alt" onclick="cd()">Padam semua soalan import</button>`;
 $('#cf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>imp(String(r.result));r.readAsText(f,'UTF-8')}}
function imp(t){const rows=csv(t).slice(1),ok=[],er=[],idx={};Object.keys(SUB).forEach(m=>SUB[m].forEach(s=>{idx[s[0]]=[m,s[0]];idx[s[1].toLowerCase()]=[m,s[0]]}));
 const ex=new Set((DB.cq||[]).map(x=>[x.s,x.y,x.t,x.st,x.q].join('|')));
 rows.forEach((r,i)=>{const L=i+2,sb=idx[(r[0]||'').trim().toLowerCase()],y=parseInt(r[1])||1,tp=(r[2]||'').trim(),st=(r[3]||'').trim(),q=(r[4]||'').trim(),o=[r[5],r[6],r[7],r[8]].map(x=>(x||'').trim()),ai='abcd'.indexOf((r[9]||'').trim().toLowerCase()),ops=o.filter(x=>x);
  if(!sb)er.push(`Baris ${L}: subjek tidak dikenali`);else if(sb[0]=='sra'&&sb[1]=='jawi'||sb[1]=='fardhu')er.push(`Baris ${L}: subjek belum dibuka`);else if(!tp||!q)er.push(`Baris ${L}: topik atau soalan kosong`);else if(ops.length<2||ai<0||!o[ai])er.push(`Baris ${L}: pilihan atau jawapan tidak sah`);
  else{const k=[sb[1],y,tp,st,q].join('|');if(ex.has(k))er.push(`Baris ${L}: soalan sudah wujud`);else{ex.add(k);ok.push({m:sb[0],s:sb[1],y,t:tp,st,q,o:ops,a:ops.indexOf(o[ai]),e:(r[10]||'').trim()||'Jawapan yang betul ialah '+o[ai]})}}});
 DB.cq=(DB.cq||[]).concat(ok);save();$('#cr').innerHTML=`<p style="color:var(--ok)">${ok.length} soalan berjaya diimport.</p>${er.length?`<p class="er">${er.length} baris tidak diimport:<br>${er.slice(0,8).join('<br>')}</p>`:''}`}
function cd(){A.innerHTML=kiki('Padam semua soalan import?')+'<p>Markah topik import juga akan dipadam.</p><button class="btn alt" onclick="cdo()">Ya, padam</button><button class="btn" onclick="cv()">Batal</button>'}
function cdo(){const bc=(m,s,y)=>(BK[m+'|'+s+'|'+y]||[]).length+(s=='mat'?1:0);DB.cq=[];Object.values(DB.users).forEach(u=>{Object.keys(u.sc||{}).forEach(k=>{const[m,s,y,i]=k.split('|');if(+i>=bc(m,s,y))delete u.sc[k]})});save();cv()}
function rs(){A.innerHTML=kiki('Padam data SRK dan SRA?')+'<button class="btn alt" onclick="U.sc={};U.st={};U.last=null;U.ls=null;save();pd()">Ya, reset</button><button class="btn" onclick="pd()">Batal</button>'}
function drag(q,nx,i,n){let left=q.d.length,wr=0;
 A.innerHTML=`${hd(i,n)}<div class="prompt">Seret gambar ke perkataan</div><div class="row">${SH(q.d).map(([h,w])=>`<div class="chip" data-w="${w}">${h}</div>`).join('')}</div><br><div class="row">${SH(q.d).map(([h,w])=>`<div class="slot" data-w="${w}">${w}</div>`).join('')}</div>`;say(q.s);
 A.querySelectorAll('.chip').forEach(c=>{c.onpointerdown=e=>{e.preventDefault();c.setPointerCapture(e.pointerId);const sx=e.clientX,sy=e.clientY;c.style.zIndex=9;
  c.onpointermove=m=>{c.style.transform=`translate(${m.clientX-sx}px,${m.clientY-sy}px)`};
  c.onpointerup=m=>{c.onpointermove=c.onpointerup=null;c.style.pointerEvents='none';const t=document.elementFromPoint(m.clientX,m.clientY);c.style.pointerEvents='';const s=t&&t.closest('.slot'),w=c.dataset.w;
   if(s&&s.dataset.w===w&&!s.classList.contains('ok')){s.classList.add('ok');s.innerHTML=c.innerHTML+' '+w;c.remove();rec(w,true);say(w);if(--left==0){sc(wr==0);setTimeout(nx,900)}}
   else{c.style.transform='';c.style.zIndex='';wr++;rec(w,false);say('Cuba lagi ya, '+U.nick)}}}})}
const ENG={mcq,eja,baca,tulis,drag};
function report(){bk(0);const g=[],w=[];for(const k in U.s){const x=U.s[k];if(x.g>=2&&x.g>x.b)g.push(k);else if(x.b>0&&x.b>=x.g)w.push(k)}
 const dn=Object.entries(U.p).map(([k,v])=>{const[l,t]=k.split(':');return`Tahap ${l} · ${TP.find(x=>x.id==t).n}: ${v} aktiviti siap`});
 A.innerHTML=`<button class="btn alt sm" onclick="home()">⬅</button><div class="card"><h2>Laporan ${U.nick}</h2><p><b>Hadiah:</b> ${U.r||0} 🏆</p><p><b>Masa belajar:</b> ${Math.round(U.t/60)} minit</p><p><b>Sesi terkini:</b><br>${(U.l||[]).slice(-10).reverse().map(x=>`${x.n}: ${fm(x.d)}${x.sc?' · markah '+x.sc:''}${x.f?'':' (belum siap)'}`).join('<br>')||'Belum ada'}</p><p><b>Aktiviti siap:</b><br>${dn.join('<br>')||'Belum ada'}</p><p><b>Sudah dikuasai:</b> ${g.join(', ')||'-'}</p><p><b>Perlu latihan:</b> ${w.join(', ')||'-'}</p></div><button class="btn" onclick="window.print()">🖨️ Cetak</button><button class="btn alt" onclick="rr()">Reset Laporan</button>`}
setInterval(()=>{if(U&&!document.hidden){U.t+=10;save()}},10000);
login();
</script></body></html>
